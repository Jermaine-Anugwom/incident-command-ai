[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "incident-command-ai"
version = "0.1.0"
description = "Evidence-bound incident planning with approval-gated ServiceNow actions."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "pytest-asyncio>=1.1,<2", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["service/src/incident_command_ai"]

[tool.pytest.ini_options]
testpaths = ["service/tests", "evaluations/tests"]
pythonpath = [".", "service/src"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
